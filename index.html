<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutroom</title>
<style>
:root { color-scheme: light dark; --fg:#1d1d1f; --muted:#6e6e73; --bg:#fff; --link:#0071e3; }
@media (prefers-color-scheme: dark) { :root { --fg:#f5f5f7; --muted:#a1a1a6; --bg:#000; --link:#2997ff; } }
body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
main { max-width:680px; margin:0 auto; padding:48px 20px 64px; }
h1 { font-size:34px; line-height:1.15; margin:0 0 8px; }
h2 { font-size:21px; margin:32px 0 8px; }
a { color:var(--link); }
nav { font-size:15px; color:var(--muted); margin-bottom:32px; }
nav a { margin-right:16px; }
em { color:var(--muted); font-style:normal; }
</style>
</head>
<body><main>
<nav><a href="/cutroom/">Cutroom</a><a href="/cutroom/support/">Support</a><a href="/cutroom/privacy/">Privacy</a></nav>
<h1>Cutroom</h1>
<p>Auto cut for TikTok. Film or import a take, tap Auto, and Cutroom cuts the pauses, filler words, false starts and retakes, word to word, on your iPhone.</p>
<p><a href="/cutroom/support/">Support</a> · <a href="/cutroom/privacy/">Privacy policy</a></p>
</main></body>
